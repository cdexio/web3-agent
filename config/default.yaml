# ZetrynAI engine configuration (non-secret). Overlays: config/<mode>.yaml.
# Values marked [TUNABLE] are defaults awaiting paper/forward-test data; the
# source of each non-tunable number is docs/research/2026-09-24-market-infra-ai-research.md.

mode: paper

routes:
  workersPerRoute: 5
  migration:
    queueMax: 50 # oldest dropped beyond this (stale by definition)
    maxPoolAgeSec: 180 # [TUNABLE] pool age to count as Migration
    dedupCooldownSec: 300
  mature:
    queueMax: 200 # kept by pre-score beyond this
    minPoolAgeSec: 1800 # [TUNABLE] 30 min
    dedupCooldownSec: 900
  warming:
    recheckIntervalSec: 60
    maxSize: 300
    expireSec: 2400 # a pool older than 40 min that never qualified is forgotten
    signalsBypassWarming: true # a KOL/trending/boost signal on a young AMM pool goes straight to Mature

scanner:
  # GeckoTerminal indexes a new pool ~150 s after creation (soak 2026-09-25), so it is a
  # Mature/warming feed; Migration detection relies on PumpPortal and the WebSocket watcher.
  geckoNewPools: { intervalSec: 15, pages: 1 } # 4 req/min
  geckoTrending: { intervalSec: 120, durations: [5m, 1h, 6h] } # 1.5 req/min
  dexscreenerLists: { intervalSec: 60 } # boosts latest/top + profiles latest = 3 of 60 req/min
  rugcheckStats: { intervalSec: 120 } # trending + new_tokens = 1 req/min
  poolResolve: { retries: 3, retryDelaySec: 10 } # DexScreener token-pairs lookup after a migration event
  # [TUNABLE] GeckoTerminal dex ids that are bonding curves (pre-graduation); they are recorded as
  # launches for creator history, never traded. Unknown dex ids are treated as AMM pools.
  # GeckoTerminal ids first, then the DexScreener spellings seen in the pool resolver
  # (pumpfun, meteoradbc, launchlab observed 2026-09-25).
  bondingCurveDexIds:
    [pump-fun, raydium-launchlab, meteora-dbc, boop-fun, moonit, moonshot, heaven, bags-fm, token-mill, virtuals-solana, daos-fun,
     pumpfun, meteoradbc, launchlab, boopfun, bags]
  # AMM dex id -> launchpad the pool graduated from, when that is known by construction.
  ammLaunchpadByDexId: { pumpswap: pump.fun }
  migrationWatcher:
    enabled: true
    # Only programs whose logs are migration-only. Never subscribe to an AMM or bonding-curve
    # program here: their logs carry every swap and would exhaust the stream budget.
    # `logMatch`: only notifications whose logs contain this text trigger a getTransaction
    # (the migration account is also mentioned by small fee transactions; probe 2026-09-25).
    programs:
      - id: 39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg
        label: pump.fun-migration
        launchpad: pump.fun
        logMatch: "Instruction: Migrate"
  pumpportal: { enabled: true }
  # A wallet above maxEventsPerHourPerWallet (one GMGN wallet produced 665 log events in 4 min on
  # 2026-09-25) is flagged bot_suspect and its transactions are no longer fetched, so Alchemy/Helius
  # credits go to human-paced wallets. [TUNABLE]
  kol: { enabled: true, maxWallets: 200, botSuspectTradesPerDay: 150, maxEventsPerHourPerWallet: 120 }

# Hard filter (design 4.1). Every threshold is [TUNABLE] from paper/forward-test data.
# A rule whose input is unknown either fails ("fail") or is skipped and reported ("skip").
filter:
  creatorBlacklistFile: config/creator-blacklist.json
  migration:
    quoteMints: [So11111111111111111111111111111111111111112, EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]
    minLiquidityUsd: 8000 # a full pump.fun curve migrates ~85 SOL (~$9.8k)
    minBuysM5: 15
    minBuyersM5: 10
    minBuySellRatioM5: 1.2
    minAgeForFlowRulesSec: 60 # below this age the m5 flow rules are skipped (window nearly empty)
    requireAuthoritiesRevoked: true
    maxRugScoreNormalised: 60
    forbidDangerRisks: true
    maxTransferFeePct: 0
    maxCreatorDeadTokenRatio: 0.6 # share of the creator's earlier tokens with market cap < $1k
    minCreatorTokensForRatio: 3
  mature:
    quoteMints: [So11111111111111111111111111111111111111112, EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v]
    minLiquidityUsd: 25000
    minVolumeH24Usd: 50000
    minVolumeToLiquidity: 0.5
    minHolders: 150
    maxTop10HoldersPct: 35
    minLpLockedPct: 90
    lpBurnedDexIds: [pumpswap] # PumpSwap burns LP tokens at migration (research 1.3)
    maxRugScoreNormalised: 40
    forbidDangerRisks: true
    maxTransferFeePct: 0
    requireSignalTag: true
  signals: # computed from the snapshot; add breakout / golden_swing tags
    breakout: { minChangeH1Pct: 15, minChangeM5Pct: 3, minVolumeH1ToHourlyAvg: 3 }
    goldenSwing: { maxChangeH24Pct: -30, minChangeH1Pct: 5, minVolumeH1ToHourlyAvg: 1.5 }

enrich:
  # Per enricher; slow sections become "unavailable". RugCheck itself answers in 0.6-2 s
  # (probe 2026-09-25) but queues behind the 10/min anonymous limit on the Mature route.
  timeouts: { migrationMs: 2500, matureMs: 6000, securityMatureMs: 20000 }
  cacheTtl: { migrationSec: 20, matureSec: 120 }
  solUsdcPair: 58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2 # Raydium SOL/USDC, for SOL price context
  contextCacheSec: 60
  kolClusterWindowMin: 10
  # GeckoTerminal is the tightest budget (20/min shared with the scanner): flow (trades + pool)
  # only on Migration, candles (m1 OHLCV) only on Mature.
  geckoFlowOnMigration: true
  geckoCandlesOnMature: true

risk:
  positionSizeSol: 0.05
  maxOpenPerRoute: 10
  totalExposureCapSol: 0.8 # [TUNABLE] owner decision 7
  dailyLossKillSwitchSol: 0.15 # [TUNABLE] owner decision 7
  maxEntryPriceImpactPct: 3
  reentry:
    mature: { enabled: true, maxPerTokenPerDay: 2, cooldownSec: 600, allowAfterStopLoss: false }
    migration: { enabled: false, maxPerTokenPerDay: 0, cooldownSec: 0, allowAfterStopLoss: false }
  exits:
    migration: # [TUNABLE] design 4.4
      hardCapSec: 240
      hardCapRangeSec: [180, 300]
      stopLossPct: -18
      trailArmPct: 25
      trailPct: 15
      partialTakePct: 40
      partialTakeFraction: 0.5
      flowExitBuySellRatio: 0.6
      flowExitConsecutiveMinutes: 2
    mature: # [TUNABLE] design 4.4
      maxHoldRangeSec: [1800, 21600]
      defaultHoldSec: 7200
      stopLossPct: -25
      ladder:
        - { atPct: 50, fraction: 0.3 }
        - { atPct: 100, fraction: 0.3 }
      trailPct: 25
  fees: # design 4.4 fee policy
    tipLamportsDefault: 5000 # SWQOS-only Helius Sender minimum (0.000005 SOL)
    tipLamportsMigrationEntry: 1000000 # 0.001 SOL, Sender Max minimum, only when enabled
    useJitoLevelTipOnMigrationEntry: false
    priorityFeePercentile: 75
    priorityFeeCapLamports: 500000 # 0.0005 SOL
    ataRentLamports: 2039280 # rent for a token account, recovered on close
    closeTokenAccountAfterExit: true

providers:
  budgetAlarmFraction: 0.8
  dexscreener:
    baseUrl: https://api.dexscreener.com
    rateLimits: # docs.dexscreener.com/api/reference
      pairs: { perMinute: 300 }
      profiles: { perMinute: 60 }
    timeoutMs: 6000
  geckoterminal:
    baseUrl: https://api.geckoterminal.com/api/v2
    apiVersion: "20230302"
    # Documented 30 req/min, but a burst of 6 calls in ~3 s already returned 429 (probe
    # 2026-09-25), so calls are spread evenly at 20/min with no burst; 429 pauses the client.
    rateLimits: { default: { perMinute: 20, burst: 1 } }
    rateLimitPauseMs: 15000
    # Adaptive: halve the rate on every 429 down to this floor, recover after 20 successes.
    # A 1-call-per-4-s probe on 2026-09-25 still saw 11/20 rejections, so the real limit moves.
    adaptiveMinPerMinute: 4
    timeoutMs: 8000
  rugcheck:
    baseUrl: https://api.rugcheck.xyz
    rateLimits:
      # Third-party docs say 10/min anonymous, but a burst of 16 full reports in 17 s returned
      # 16x 200 (probe 2026-09-25). 40/min with burst 2 keeps a safety margin; 429s still pause.
      anonymous: { perMinute: 40, burst: 2 }
      authenticated: { perMinute: 60 } # per API key
    timeoutMs: 10000
  helius:
    rpcUrlTemplate: https://mainnet.helius-rpc.com/?api-key={key}
    wsUrlTemplate: wss://mainnet.helius-rpc.com/?api-key={key}
    senderUrl: https://sender.helius-rpc.com/fast
    senderRegionalUrl: http://sg-sender.helius-rpc.com/fast
    rateLimits: { default: { perSecond: 10 } } # Free plan
    monthlyCreditBudget: 1000000 # Free plan
    creditCosts: { rpc: 1, das: 10, getProgramAccounts: 10, streamPerMb: 20 }
    # All Helius WebSocket traffic is billed 20 credits/MB since 2026-05-01. Streams go to
    # Alchemy first; Helius is the second choice for low-volume subscriptions (a migration
    # program stream is ~2 MB/day ~ 1,200 credits/month) with byte accounting and the 80% alarm.
    wsEnabled: true
    timeoutMs: 8000
  alchemy:
    rpcUrlTemplate: https://solana-mainnet.g.alchemy.com/v2/{key}
    # Subscriptions live on the streaming host, not the RPC host (verified 2026-09-25:
    # the RPC host answers "Method not found" for every *Subscribe).
    wsUrlTemplate: wss://solana-mainnet.streaming.alchemy.com/v2/{key}
    monthlyComputeUnitBudget: 30000000 # Free tier
    computeUnitPerStreamEventEstimate: 40 # Alchemy docs: ~1000-byte event ~ 40 CU
    computeUnitPerRpcCallEstimate: 20 # [TUNABLE] estimate; replace with dashboard-measured value
    maxWsConnections: 100
    rateLimits: { default: { perSecond: 25 } }
    timeoutMs: 8000
  websocket:
    maxSubscriptionsPerConnection: 500 # [TUNABLE] conservative; Helius documents 1000/connection
    # A runaway subscription is dropped at the socket (one bot wallet streamed 113 msgs/s of
    # failed transactions on 2026-09-25, ~235M Alchemy CU/day if left alone). [TUNABLE]
    maxMessagesPerMinutePerSubscription: 600
    pingIntervalMs: 30000
    reconnectBaseMs: 2000
    reconnectMaxMs: 60000
  publicRpc:
    httpUrls: [https://api.mainnet-beta.solana.com]
    wsUrls: [wss://api.mainnet-beta.solana.com]
    rateLimits: { default: { perSecond: 4 } } # 40 requests per 10 seconds per IP
    timeoutMs: 10000
  jupiter:
    baseUrl: https://api.jup.ag/swap/v2
    rateLimits: { default: { perSecond: 1 } } # conservative until headers are observed
    timeoutMs: 8000
    referenceQuote:
      inputMint: So11111111111111111111111111111111111111112
      outputMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      amount: "10000000"
  pumpportal:
    wsUrl: wss://pumpportal.fun/api/data
    reconnectBaseMs: 5000
    reconnectMaxMs: 120000
  deepseek:
    baseUrl: https://api.deepseek.com
    model: deepseek-v4-flash
    timeoutMs: 8000
  claude:
    model: claude-opus-5-5
    effort: medium
    healthTimeoutMs: 60000

ai:
  primary: claude
  fallback: deepseek
  thresholds: { migrationPWin: 0.65, maturePWin: 0.65 } # [TUNABLE]
  timeouts: { migrationMs: 2500, matureMs: 8000 } # [TUNABLE]
  claudeDailyCallCap: 2000

kol:
  walletsFile: config/kol-wallets.json

twitter:
  sidecarUrl: http://127.0.0.1:8765
  timeoutMs: 3000

db:
  poolMax: 10
  heartbeatIntervalSec: 60
  statementTimeoutMs: 15000
